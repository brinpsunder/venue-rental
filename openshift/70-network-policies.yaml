---
# Dovoli OpenShift routerju (in vsem ostalim namespace-om) dostop do podov,
# ki so izpostavljeni prek Route. Brez tega Sandbox-ova privzeta politika
# "allow-same-namespace" blokira ves zunanji promet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-public-pods
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [shell, web-bff, mobile-bff, jaeger]
  ingress:
    - from:
        - namespaceSelector: {}

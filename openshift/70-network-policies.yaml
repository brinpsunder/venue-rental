apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-db-from-user-service-only
spec:
  podSelector:
    matchLabels:
      app: user-db
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: user-service
      ports:
        - protocol: TCP
          port: 5432
---

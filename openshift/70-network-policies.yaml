apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: venue-rental
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-traffic
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: venue-rental
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: venue-rental
